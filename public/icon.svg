<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d134d" />
      <stop offset="60%" stop-color="#140b24" />
      <stop offset="100%" stop-color="#090512" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe277" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#8a6316" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="sevenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />

  <!-- Outer Golden Frame Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldBorder)" stroke-width="8" opacity="0.9" />
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.4" />

  <!-- Decorative Corner Rivets / Casino Bulbs -->
  <circle cx="56" cy="56" r="8" fill="#ffd700" />
  <circle cx="456" cy="56" r="8" fill="#ffd700" />
  <circle cx="56" cy="456" r="8" fill="#ffd700" />
  <circle cx="456" cy="456" r="8" fill="#ffd700" />

  <!-- Top Ribbon / Crown Arch -->
  <path d="M 156 120 Q 256 90 356 120" fill="none" stroke="url(#goldBorder)" stroke-width="6" stroke-linecap="round" />
  <polygon points="256,92 263,107 280,107 266,117 271,132 256,123 241,132 246,117 232,107 249,107" fill="#ffd700" filter="url(#glow)" />

  <!-- Casino Machine Reel Frame Center (Within 80% Safe Zone) -->
  <rect x="96" y="150" width="320" height="240" rx="24" fill="#0c0717" stroke="url(#goldBorder)" stroke-width="5" />
  <rect x="104" y="158" width="304" height="224" rx="18" fill="#000000" opacity="0.8" />

  <!-- Reel Dividers -->
  <line x1="202" y1="158" x2="202" y2="382" stroke="#d4af37" stroke-width="2" opacity="0.5" />
  <line x1="310" y1="158" x2="310" y2="382" stroke="#d4af37" stroke-width="2" opacity="0.5" />

  <!-- Lucky 7 - Center (Main Icon) -->
  <g transform="translate(196, 172) scale(1.15)">
    <!-- Red 7 with Gold Trim -->
    <path d="M 8 10 L 92 10 L 46 160 L 22 160 L 64 36 L 8 36 Z" fill="url(#sevenGradient)" stroke="url(#goldPlate)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
    <!-- 7 Inner Highlight -->
    <path d="M 18 16 L 82 16 L 48 140 L 32 140 L 60 30 L 18 30 Z" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Left Mini 7 -->
  <g transform="translate(112, 190) scale(0.75)" opacity="0.85">
    <path d="M 8 10 L 92 10 L 46 160 L 22 160 L 64 36 L 8 36 Z" fill="url(#sevenGradient)" stroke="url(#goldPlate)" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Right Mini 7 -->
  <g transform="translate(320, 190) scale(0.75)" opacity="0.85">
    <path d="M 8 10 L 92 10 L 46 160 L 22 160 L 64 36 L 8 36 Z" fill="url(#sevenGradient)" stroke="url(#goldPlate)" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- Sparkling Diamond & Stars -->
  <polygon points="120,330 135,340 120,350 105,340" fill="#00f0ff" filter="url(#glow)" />
  <polygon points="392,330 407,340 392,350 377,340" fill="#00f0ff" filter="url(#glow)" />

  <!-- Bottom Gold Plaque: "VEGAS" -->
  <rect x="136" y="408" width="240" height="42" rx="10" fill="url(#goldPlate)" stroke="#fff" stroke-width="1.5" />
  <text x="256" y="436" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#1b1202" text-anchor="middle" letter-spacing="4">VEGAS 777</text>
</svg>
